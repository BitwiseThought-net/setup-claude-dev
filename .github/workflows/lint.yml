name: CI Linting

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Linters
        uses: github/super-linter@v5
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Validate Bash (.sh)
          VALIDATE_BASH: true
          # Validate PowerShell (.ps1)
          VALIDATE_POWERSHELL_7: true
          # Validate Documentation (.md)
          VALIDATE_MARKDOWN: true
